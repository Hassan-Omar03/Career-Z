<!-- FILE: pages/forgot-password.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — CareerZ.pk</title>
<meta name="description" content="Reset your CareerZ.pk password.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://careerz.pk/pages/forgot-password.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- ============ NAVBAR (minimal, auth pages) ============ -->
<header class="nav">
  <div class="container nav-inner">
    <a href="../index.html" class="logo"><span class="dot"></span><span class="logo-text">Career<span class="pk">Z.pk</span></span></a>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">☀️</button>
    </div>
  </div>
</header>

<!-- ============ FORGOT PASSWORD ============ -->
<section class="auth-shell">
  <div class="auth-wrap">
    <a href="login.html" class="auth-back">← Back to sign in</a>

    <div class="auth-card reveal in">
      <div class="auth-head">
        <div class="eyebrow">Account recovery</div>
        <h1>Forgot your password?</h1>
        <p>Enter the email linked to your account and we'll send you a reset link.</p>
      </div>

      <div class="auth-success" id="forgot-success">
        <span class="dot"></span>
        <span>If an account exists for that email, a reset link is on its way.</span>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">Email address</label>
          <input class="form-input" type="email" id="forgot-email" name="email" placeholder="you@example.com" autocomplete="email">
          <div class="form-error" id="forgot-email-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">Send Reset Link</button>
      </form>

      <div class="auth-foot">
        Remembered your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>
</section>

<script src="../assets/js/auth.js"></script>
</body>
</html>
