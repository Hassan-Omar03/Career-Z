<!-- FILE: pages/reset-password.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — CareerZ.pk</title>
<meta name="description" content="Set a new password for your CareerZ.pk account.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://careerz.pk/pages/reset-password.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- ============ NAVBAR (minimal, auth pages) ============ -->
<header class="nav">
  <div class="container nav-inner">
    <a href="../index.html" class="logo"><span class="dot"></span><span class="logo-text">Career<span class="pk">Z.pk</span></span></a>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">☀️</button>
    </div>
  </div>
</header>

<!-- ============ RESET PASSWORD ============ -->
<section class="auth-shell">
  <div class="auth-wrap">
    <a href="login.html" class="auth-back">← Back to sign in</a>

    <div class="auth-card reveal in">
      <div class="auth-head">
        <div class="eyebrow">Account recovery</div>
        <h1>Set a new password</h1>
        <p>Choose a strong password you haven't used before.</p>
      </div>

      <div class="auth-success" id="reset-success">
        <span class="dot"></span>
        <span>Your password has been updated. You can now sign in.</span>
      </div>

      <form id="reset-form" novalidate>
        <input type="hidden" id="reset-token" name="token" value="">

        <div class="form-group">
          <label for="reset-password">New password</label>
          <div class="password-wrap">
            <input class="form-input" type="password" id="reset-password" name="password" placeholder="Enter new password" autocomplete="new-password">
            <button type="button" class="password-toggle" data-toggle-password="reset-password">Show</button>
          </div>
          <div class="password-strength"><div class="password-strength-bar" id="reset-strength-bar"></div></div>
          <span class="password-strength-label" id="reset-strength-label"></span>
          <div class="form-error" id="reset-password-error"></div>
        </div>

        <div class="form-group">
          <label for="reset-confirm">Confirm new password</label>
          <div class="password-wrap">
            <input class="form-input" type="password" id="reset-confirm" name="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password">
            <button type="button" class="password-toggle" data-toggle-password="reset-confirm">Show</button>
          </div>
          <div class="form-error" id="reset-confirm-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Update Password</button>
      </form>

      <div class="auth-foot">
        <a href="login.html">Back to Sign In</a>
      </div>
    </div>
  </div>
</section>

<script src="../assets/js/auth.js"></script>
</body>
</html>
